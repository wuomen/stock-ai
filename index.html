<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>AI实时做T助手</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #21262d;
            --text: #e6edf3;
            --sub: #8b949e;
            --red: #f85149;
            --green: #3fb950;
            --yellow: #d2991d;
            --blue: #58a6ff;
            --accent: #1f6feb;
            --radius: 14px;
            --font-md: 1rem;
            --font-sm: 0.82rem;
            --font-xs: 0.7rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 12px 100px;
            -webkit-tap-highlight-color: transparent;
        }
        .header {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 0 10px;
            position: sticky; top: 0; z-index: 10; background: var(--bg);
        }
        .header .logo { font-size: 1.1rem; font-weight: 700; color: #fff; white-space: nowrap; }
        .header .logo .dot { color: var(--green); }
        .search-box { flex: 1; display: flex; gap: 6px; align-items: center; }
        .search-box input {
            flex: 1; padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--card); color: #fff;
            font-size: var(--font-md); font-weight: 600; outline: none;
        }
        .btn {
            padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--card); color: #fff; font-size: var(--font-sm);
            font-weight: 600; cursor: pointer; white-space: nowrap;
            transition: all 0.15s; outline: none;
        }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-accent { background: var(--accent); border-color: var(--accent); }
        .btn-sm { padding: 8px 12px; font-size: var(--font-xs); border-radius: 8px; }
        .price-card {
            background: var(--card); border-radius: var(--radius); padding: 14px 16px;
            margin: 8px 0; border: 1px solid var(--border);
        }
        .price-now { font-size: 2.4rem; font-weight: 800; }
        .price-change { font-size: 1.25rem; font-weight: 700; }
        .price-change.up { color: var(--red); }
        .price-change.down { color: var(--green); }
        .info-grid {
            display: grid; grid-template-columns: repeat(4,1fr);
            gap: 4px 8px; width: 100%; font-size: var(--font-xs); color: var(--sub);
            margin-top: 6px;
        }
        .info-grid span { color: #fff; font-weight: 600; font-size: var(--font-sm); }
        .chart-container {
            background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border); margin: 8px 0;
            padding: 8px 4px; position: relative; height: 220px;
        }
        .chart-container canvas { width: 100%; height: 100%; display: block; }
        .chart-label {
            position: absolute; top: 6px; left: 10px;
            font-size: var(--font-xs); color: var(--sub); pointer-events: none;
        }
        .ai-panel {
            background: linear-gradient(135deg, #1a1f2e, #161b22);
            border-radius: var(--radius); border: 1.5px solid #30363d;
            padding: 14px 16px; margin: 8px 0;
        }
        .ai-badge {
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            color: #fff; font-size: var(--font-xs); font-weight: 700;
            padding: 4px 10px; border-radius: 20px;
        }
        .ai-signal { font-size: 1.25rem; font-weight: 800; padding: 6px 0; }
        .ai-signal.buy { color: var(--red); }
        .ai-signal.sell { color: var(--green); }
        .ai-signal.wait { color: var(--yellow); }
        .ai-detail { font-size: var(--font-sm); color: #c9d1d9; margin-top: 4px; }
        .ai-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .ai-price-item {
            background: rgba(255,255,255,0.03); border-radius: 10px;
            padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);
        }
        .ai-price-item .label { color: var(--sub); font-size: var(--font-xs); margin-bottom: 3px; }
        .ai-price-item .val { font-weight: 700; font-size: var(--font-md); }
        .ai-price-item .val.sell-p { color: var(--green); }
        .ai-price-item .val.buy-p { color: var(--red); }
        .score-bar { flex: 1; height: 4px; border-radius: 2px; background: #21262d; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 2px; }
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #1f6feb; color: #fff; padding: 10px 22px;
            border-radius: 30px; font-weight: 700; font-size: var(--font-sm);
            z-index: 99; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
        .toast.warn { background: #d2991d; }
    </style>
</head>
<body>
    <div class="header">
        <span class="logo"><span class="dot">●</span> AI做T</span>
        <div class="search-box">
            <input type="text" id="codeInput" placeholder="输入代码，如 600519" inputmode="numeric" autofocus>
            <button class="btn btn-accent btn-sm" onclick="searchStock()">查询</button>
        </div>
    </div>

    <div class="price-card" id="priceCard">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
            <span class="price-now" id="priceNow" style="color:#e6edf3">--</span>
            <span class="price-change" id="priceChange" style="color:#8b949e">--</span>
        </div>
        <div style="font-size:var(--font-xs);color:var(--sub);margin-top:4px" id="stockNameFull">输入代码查看实时行情</div>
        <div class="info-grid">
            <div>开盘<span id="infoOpen">--</span></div>
            <div>最高<span id="infoHigh">--</span></div>
            <div>最低<span id="infoLow">--</span></div>
            <div>昨收<span id="infoPre">--</span></div>
            <div>振幅<span id="infoAmp">--</span></div>
            <div>量比<span id="infoQrr">--</span></div>
            <div>换手<span id="infoTurn">--</span></div>
            <div>成交额<span id="infoAmt">--</span></div>
        </div>
    </div>

    <div class="chart-container" id="chartContainer">
        <span class="chart-label">📈 分时走势</span>
        <canvas id="chartCanvas"></canvas>
    </div>

    <div class="ai-panel">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="ai-badge">🤖 AI分析</span>
            <span style="font-size:var(--font-xs);color:var(--sub)" id="aiUpdateTime">--</span>
        </div>
        <div class="ai-signal wait" id="aiSignal">⏳ 等待数据...</div>
        <div class="ai-detail" id="aiDetail"></div>
        <div class="ai-prices">
            <div class="ai-price-item">
                <div class="label">🎯 高抛/止盈价</div>
                <div class="val sell-p" id="aiSellPrice">--</div>
            </div>
            <div class="ai-price-item">
                <div class="label">🎯 低吸/止损价</div>
                <div class="val buy-p" id="aiBuyPrice">--</div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--font-xs);color:var(--sub)">
            <span>综合评分</span>
            <div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%;background:#d2991d"></div></div>
            <span id="scoreText">0</span>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentCode = '';
        let currentFullCode = '';
        let currentName = '';
        let priceData = { now:0, open:0, high:0, low:0, preClose:0, volume:0, amount:0, turnover:0, qrr:0 };
        let minuteData = [];
        let dailyKlines = [];

        function showToast(msg, type='') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.className = 'toast', 2000);
        }

        // 纯数字代码 → sh/sz+代码
        function toFullCode(numCode) {
            numCode = String(numCode).trim();
            if (/^\d{6}$/.test(numCode)) {
                if (numCode.startsWith('6')) return 'sh' + numCode;
                return 'sz' + numCode;
            }
            return null;
        }

        // 新浪 JSONP 接口（国内稳）
        const SINA_BASE = 'https://hq.sinajs.cn/list=';

        function jsonp(url, timeoutMs=8000) {
            return new Promise((resolve, reject) => {
                const cbName = '_cb_' + Date.now() + Math.random().toString(36).substr(2,5);
                const script = document.createElement('script');
                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error('超时'));
                }, timeoutMs);
                function cleanup() {
                    clearTimeout(timer);
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }
                window[cbName] = function(data) {
                    cleanup();
                    resolve(data);
                };
                script.onerror = () => { cleanup(); reject(new Error('网络错误')); };
                script.src = url + '&callback=' + cbName + '&_=' + Date.now();
                document.head.appendChild(script);
            });
        }

        function parseSinaQuote(raw, fullCode) {
            let str = '';
            if (typeof raw === 'string') str = raw;
            else if (Array.isArray(raw)) str = raw.join('\n');
            else str = JSON.stringify(raw);
            const lines = str.split('\n');
            for (const line of lines) {
                if (line.includes(fullCode)) {
                    const match = line.match(/"([^"]+)"/);
                    if (match) str = match[1];
                    break;
                }
            }
            const parts = str.split(',');
            if (parts.length < 30) return null;
            const info = {
                name: parts[0] || '',
                open: parseFloat(parts[1]) || 0,
                preClose: parseFloat(parts[2]) || 0,
                now: parseFloat(parts[3]) || 0,
                high: parseFloat(parts[4]) || 0,
                low: parseFloat(parts[5]) || 0,
                volume: parseFloat(parts[8]) || 0,
                amount: parseFloat(parts[9]) || 0,
                turnover: 0,
                qrr: 0,
            };
            if (info.now <= 0) return null;
            return info;
        }

        async function fetchQuote(fullCode) {
            const raw = await jsonp(SINA_BASE + fullCode);
            const data = parseSinaQuote(raw, fullCode);
            if (!data || data.now <= 0) throw new Error('无数据');
            return data;
        }

        async function fetchMinuteData(fullCode) {
            return [];
        }

        async function fetchKline(fullCode) {
            return [];
        }

        function calcEMA(data, period) {
            if (data.length < period) return Array(data.length).fill(null);
            const k = 2 / (period + 1);
            const result = [data[0]];
            for (let i = 1; i < data.length; i++) result.push(data[i] * k + result[i-1] * (1 - k));
            for (let i = 0; i < period-1; i++) result[i] = null;
            return result;
        }

        function calcMACD(closes) {
            const ema12 = calcEMA(closes, 12), ema26 = calcEMA(closes, 26);
            const dif = [], dea = [], macd = [];
            for (let i = 0; i < closes.length; i++) dif.push(ema12[i] !== null && ema26[i] !== null ? ema12[i] - ema26[i] : null);
            const vd = dif.filter(d => d !== null);
            const dc = calcEMA(vd, 9);
            let idx = 0;
            for (let i = 0; i < dif.length; i++) dea.push(dif[i] !== null && idx < dc.length ? dc[idx++] : null);
            for (let i = 0; i < dif.length; i++) macd.push(dif[i] !== null && dea[i] !== null ? (dif[i] - dea[i]) * 2 : null);
            return { dif, dea, macd };
        }

        function calcKDJ(highs, lows, closes, n=9) {
            const k=[],d=[],j=[];
            for (let i=0;i<closes.length;i++) {
                if (i<n-1){k.push(null);d.push(null);j.push(null);continue;}
                const hh=Math.max(...highs.slice(i-n+1,i+1)),ll=Math.min(...lows.slice(i-n+1,i+1));
                const r=hh===ll?50:((closes[i]-ll)/(hh-ll))*100;
                const pk=i>0&&k[i-1]!==null?k[i-1]:50,pd=i>0&&d[i-1]!==null?d[i-1]:50;
                const kv=pk*2/3+r/3,dv=pd*2/3+kv/3,jv=3*kv-2*dv;
                k.push(kv);d.push(dv);j.push(jv);
            }
            return {k,d,j};
        }

        function calcRSI(closes, period=14) {
            const rsi=[];
            for (let i=0;i<closes.length;i++) {
                if (i<period){rsi.push(null);continue;}
                let g=0,l=0;
                for (let t=i-period+1;t<=i;t++){const d=closes[t]-closes[t-1];if(d>0)g+=d;else l+=Math.abs(d);}
                rsi.push(l===0?100:100-100/(1+g/l));
            }
            return rsi;
        }

        function calcBOLL(closes, period=20, mult=2) {
            const ma=[],u=[],l=[];
            for (let i=0;i<closes.length;i++) {
                if (i<period-1){ma.push(null);u.push(null);l.push(null);continue;}
                const s=closes.slice(i-period+1,i+1),m=s.reduce((a,b)=>a+b,0)/period;
                const v=s.reduce((sum,val)=>sum+Math.pow(val-m,2),0)/period;
                const std=Math.sqrt(v);
                ma.push(m);u.push(m+mult*std);l.push(m-mult*std);
            }
            return {ma,upper:u,lower:l};
        }

        function findSR(kl) {
            if (kl.length<20) return {s:0,r:0};
            const hi=kl.map(k=>k.high),lo=kl.map(k=>k.low);
            const pk=[],tr=[];
            for (let i=5;i<hi.length-5;i++) {
                let p=true,t=true;
                for (let j=i-3;j<=i+3;j++){if(j!==i&&hi[j]>=hi[i])p=false;if(j!==i&&lo[j]<=lo[i])t=false;}
                if(p)pk.push(hi[i]);if(t)tr.push(lo[i]);
            }
            const r=pk.length?pk.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,pk.length):Math.max(...hi.slice(-20));
            const s=tr.length?tr.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,tr.length):Math.min(...lo.slice(-20));
            return {s:Math.round(s*100)/100,r:Math.round(r*100)/100};
        }

        function aiAnalyze(pd, mins, kls) {
            const now=pd.now, pre=pd.preClose;
            const amp=pd.high>0&&pd.low>0?((pd.high-pd.low)/pre*100):0;
            pd.amp=amp;
            let sb=0, ss=0;
            const re=[];
            if (mins.length>30&&now>0) {
                const avg=mins.slice(-30).reduce((s,m)=>s+m.avg,0)/30;
                const dev=(now-avg)/avg*100;
                if (dev<-0.5) sb+=12; else if (dev>0.6) ss+=14;
            }
            if (kls.length>=30) {
                const cl=kls.map(k=>k.close);
                const mac=calcMACD(cl);
                const lm=mac.macd[mac.macd.length-1],pm=mac.macd[mac.macd.length-2];
                if (lm!==null&&pm!==null){if(lm>pm&&lm<0)sb+=10;if(lm<pm&&lm>0)ss+=10;}
                const kdj=calcKDJ(kls.map(k=>k.high),kls.map(k=>k.low),cl);
                const lk=kdj.k[kdj.k.length-1],ld=kdj.d[kdj.d.length-1];
                if (lk!==null&&ld!==null){if(lk<25&&ld<25)sb+=8;if(lk>75&&ld>75)ss+=8;}
                const rsi=calcRSI(cl);
                const lr=rsi[rsi.length-1];
                if (lr!==null){if(lr<30)sb+=8;if(lr>70)ss+=8;}
                const bo=calcBOLL(cl);
                const lu=bo.upper[bo.upper.length-1],ll=bo.lower[bo.lower.length-1];
                if (ll!==null){if(cl[cl.length-1]<=ll*1.01)sb+=10;if(cl[cl.length-1]>=lu*0.99)ss+=10;}
                const sr=findSR(kls);
                if (sr.s>0){const d=(now-sr.s)/sr.s*100;if(d<1.5)sb+=12;}
                if (sr.r>0){const d=(sr.r-now)/now*100;if(d<1.5)ss+=12;}
            }
            let ts=0.005;
            if (amp>4) ts=0.015; else if (amp>2.5) ts=0.01; else if (amp>1.5) ts=0.007;
            let action='wait',label='⏸ 建议观望不动',cls='wait';
            let bp=0,sp=0;
            if (sb>45&&sb>ss+15){action='buy';label='📈 适合做正T';cls='buy';bp=now*(1-ts*0.4);sp=now*(1+ts);}
            else if (ss>45&&ss>sb+15){action='sell';label='📉 适合做反T';cls='sell';sp=now*(1+ts*0.4);bp=now*(1-ts);}
            else if (sb>30){action='lean_buy';label='👀 偏多，可轻仓';cls='buy';bp=now*0.997;sp=now*1.008;}
            else if (ss>30){action='lean_sell';label='👀 偏空，可轻仓';cls='sell';sp=now*1.003;bp=now*0.992;}
            else {bp=now*0.995;sp=now*1.005;}
            return {action,label,cls,buyPrice:+bp.toFixed(2),sellPrice:+sp.toFixed(2),scorePercent:Math.min(100,Math.round(Math.max(sb,ss)/100*100)),detailText:re.slice(0,3).join('; ')||'指标正常'};
        }

        function updateUI() {
            const p=priceData;
            document.getElementById('priceNow').textContent=p.now>0?p.now.toFixed(2):'--';
            const chg=document.getElementById('priceChange');
            if (p.now>0&&p.preClose>0) {
                const diff=p.now-p.preClose,pct=diff/p.preClose*100,sign=diff>=0?'+':'';
                chg.textContent=sign+diff.toFixed(2)+' ('+sign+pct.toFixed(2)+'%)';
                chg.className='price-change '+(diff>0?'up':'down');
                document.getElementById('priceNow').style.color=diff>0?'#f85149':'#3fb950';
            }
            document.getElementById('stockNameFull').textContent=(currentName||'--')+' | '+currentCode;
            document.getElementById('infoOpen').textContent=p.open>0?p.open.toFixed(2):'--';
            document.getElementById('infoHigh').textContent=p.high>0?p.high.toFixed(2):'--';
            document.getElementById('infoLow').textContent=p.low>0?p.low.toFixed(2):'--';
            document.getElementById('infoPre').textContent=p.preClose>0?p.preClose.toFixed(2):'--';
            const amp=p.amp||(p.high>0&&p.low>0?((p.high-p.low)/p.preClose*100):0);
            document.getElementById('infoAmp').textContent=amp>0?amp.toFixed(2)+'%':'--';
            document.getElementById('infoQrr').textContent=p.qrr>0?p.qrr.toFixed(2):'--';
            document.getElementById('infoTurn').textContent=p.turnover>0?p.turnover.toFixed(2)+'%':'--';
            document.getElementById('infoAmt').textContent=p.amount>0?(p.amount>=10000?(p.amount/10000).toFixed(2)+'亿':p.amount.toFixed(0)+'万'):'--';
        }

        function updateAI(a) {
            document.getElementById('aiSignal').textContent=a.label;
            document.getElementById('aiSignal').className='ai-signal '+a.cls;
            document.getElementById('aiDetail').textContent=a.detailText;
            document.getElementById('aiSellPrice').textContent=a.sellPrice>0?a.sellPrice.toFixed(2):'--';
            document.getElementById('aiBuyPrice').textContent=a.buyPrice>0?a.buyPrice.toFixed(2):'--';
            document.getElementById('scoreFill').style.width=a.scorePercent+'%';
            const f=document.getElementById('scoreFill');
            f.style.background=a.cls==='buy'?'#f85149':a.cls==='sell'?'#3fb950':'#d2991d';
            document.getElementById('scoreText').textContent=a.scorePercent;
            document.getElementById('aiUpdateTime').textContent=new Date().toLocaleTimeString('zh-CN');
        }

        function drawChart() {
            const c=document.getElementById('chartContainer');
            const cv=document.getElementById('chartCanvas');
            const dpr=window.devicePixelRatio||1;
            const r=c.getBoundingClientRect();
            const w=r.width-8,h=r.height-8;
            cv.width=w*dpr;cv.height=h*dpr;
            cv.style.width=w+'px';cv.style.height=h+'px';
            const ctx=cv.getContext('2d');
            ctx.scale(dpr,dpr);
            ctx.clearRect(0,0,w,h);
            if (minuteData.length<5) {
                ctx.fillStyle='#8b949e';ctx.font='14px sans-serif';
                ctx.textAlign='center';ctx.fillText('分时数据加载中...',w/2,h/2);
                return;
            }
            const prices=minuteData.map(m=>m.price);
            let minP=Math.min(...prices),maxP=Math.max(...prices);
            if (priceData.high>0) maxP=Math.max(maxP,priceData.high);
            if (priceData.low>0) minP=Math.min(minP,priceData.low);
            const range=maxP-minP||1,pad=range*0.1;
            const yMin=minP-pad,yMax=maxP+pad;
            const margin={top:20,right:15,bottom:25,left:55};
            const pw=w-margin.left-margin.right,ph=h-margin.top-margin.bottom;
            const xP=i=>margin.left+(i/Math.max(minuteData.length-1,1))*pw;
            const yP=p=>margin.top+ph-((p-yMin)/(yMax-yMin))*ph;
            ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.5;
            for (let i=0;i<=5;i++) {
                const y=margin.top+(ph/5)*i;
                ctx.beginPath();ctx.moveTo(margin.left,y);ctx.lineTo(w-margin.right,y);ctx.stroke();
                ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='right';
                ctx.fillText((yMax-(yMax-yMin)*(i/5)).toFixed(2),margin.left-4,y+3);
            }
            if (priceData.preClose>=yMin&&priceData.preClose<=yMax) {
                const yp=yP(priceData.preClose);
                ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,0.2)';
                ctx.beginPath();ctx.moveTo(margin.left,yp);ctx.lineTo(w-margin.right,yp);ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.strokeStyle='#58a6ff';ctx.lineWidth=2;ctx.beginPath();
            minuteData.forEach((m,i)=>{const x=xP(i),y=yP(m.price);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
            ctx.stroke();
        }

        async function searchStock() {
            const input=document.getElementById('codeInput').value.trim();
            if (!input) return showToast('请输入股票代码','warn');
            const full=toFullCode(input);
            if (!full) return showToast('代码格式错误（6位数字）','warn');
            currentCode=input;
            currentFullCode=full;
            document.getElementById('aiSignal').textContent='⏳ 加载中...';
            try {
                const quote=await fetchQuote(full);
                if (!quote||quote.now<=0) throw new Error('无行情');
                currentName=quote.name||input;
                priceData={...quote,amp:0};
                minuteData=[];
                dailyKlines=[];
                updateUI();
                drawChart();
                document.getElementById('aiSignal').textContent='✅ 数据已连接（来自新浪财经）';
                document.getElementById('aiSignal').className='ai-signal wait';
                document.getElementById('aiDetail').textContent='输入其他代码即可查询。分时图与AI分析需更完整接口支持。';
            } catch(e) {
                document.getElementById('aiSignal').textContent='⚠ 获取失败';
                showToast('获取失败，请重试','warn');
            }
        }

        document.getElementById('codeInput').addEventListener('keypress',e=>{if(e.key==='Enter')searchStock();});
        window.addEventListener('load',()=>{document.getElementById('codeInput').value='600519';searchStock();});
    </script>
</body>
</html>
