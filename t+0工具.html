<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>AI实时做T助手</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #21262d;
            --text: #e6edf3;
            --sub: #8b949e;
            --red: #f85149;
            --green: #3fb950;
            --yellow: #d2991d;
            --blue: #58a6ff;
            --accent: #1f6feb;
            --radius: 14px;
            --font-md: 1rem;
            --font-sm: 0.82rem;
            --font-xs: 0.7rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 12px 100px;
            -webkit-tap-highlight-color: transparent;
        }
        .header {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 0 10px;
            position: sticky; top: 0; z-index: 10; background: var(--bg);
        }
        .header .logo { font-size: 1.1rem; font-weight: 700; color: #fff; white-space: nowrap; }
        .header .logo .dot { color: var(--green); }
        .search-box {
            flex: 1; display: flex; gap: 6px; align-items: center;
        }
        .search-box input {
            flex: 1; padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--card); color: #fff;
            font-size: var(--font-md); font-weight: 600; outline: none;
        }
        .search-box input::placeholder { color: #6e7681; }
        .btn {
            padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--card); color: #fff; font-size: var(--font-sm);
            font-weight: 600; cursor: pointer; white-space: nowrap;
            transition: all 0.15s; outline: none;
        }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-accent { background: var(--accent); border-color: var(--accent); }
        .btn-sm { padding: 8px 12px; font-size: var(--font-xs); border-radius: 8px; }
        .price-card {
            background: var(--card); border-radius: var(--radius); padding: 14px 16px;
            margin: 8px 0; border: 1px solid var(--border);
            display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
        }
        .price-now {
            font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; line-height: 1;
        }
        .price-change { font-size: 1.25rem; font-weight: 700; }
        .price-change.up { color: var(--red); }
        .price-change.down { color: var(--green); }
        .info-grid {
            display: grid; grid-template-columns: repeat(4,1fr);
            gap: 4px 8px; width: 100%; font-size: var(--font-xs); color: var(--sub);
            margin-top: 6px;
        }
        .info-grid span { color: #fff; font-weight: 600; font-size: var(--font-sm); }
        .chart-container {
            background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border); margin: 8px 0;
            padding: 8px 4px; position: relative; height: 220px;
        }
        .chart-container canvas { width: 100%; height: 100%; display: block; }
        .chart-label {
            position: absolute; top: 6px; left: 10px;
            font-size: var(--font-xs); color: var(--sub); pointer-events: none;
        }
        .ai-panel {
            background: linear-gradient(135deg, #1a1f2e, #161b22);
            border-radius: var(--radius); border: 1.5px solid #30363d;
            padding: 14px 16px; margin: 8px 0; position: relative;
        }
        .ai-badge {
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            color: #fff; font-size: var(--font-xs); font-weight: 700;
            padding: 4px 10px; border-radius: 20px;
        }
        .ai-signal {
            font-size: 1.25rem; font-weight: 800; padding: 6px 0;
        }
        .ai-signal.buy { color: var(--red); }
        .ai-signal.sell { color: var(--green); }
        .ai-signal.wait { color: var(--yellow); }
        .ai-detail { font-size: var(--font-sm); color: #c9d1d9; margin-top: 4px; }
        .ai-prices {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
        }
        .ai-price-item {
            background: rgba(255,255,255,0.03); border-radius: 10px;
            padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);
        }
        .ai-price-item .label { color: var(--sub); font-size: var(--font-xs); margin-bottom: 3px; }
        .ai-price-item .val { font-weight: 700; font-size: var(--font-md); }
        .ai-price-item .val.sell-p { color: var(--green); }
        .ai-price-item .val.buy-p { color: var(--red); }
        .score-bar {
            flex: 1; height: 4px; border-radius: 2px; background: #21262d; overflow: hidden;
        }
        .score-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #1f6feb; color: #fff; padding: 10px 22px;
            border-radius: 30px; font-weight: 700; font-size: var(--font-sm);
            z-index: 99; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
        .toast.warn { background: #d2991d; }
    </style>
</head>
<body>
    <div class="header">
        <span class="logo"><span class="dot">●</span> AI做T</span>
        <div class="search-box">
            <input type="text" id="codeInput" placeholder="输入代码，如 600519" inputmode="numeric" autofocus>
            <button class="btn btn-accent btn-sm" onclick="searchStock()">查询</button>
        </div>
    </div>

    <div class="price-card" id="priceCard">
        <div style="width:100%">
            <span class="price-now" id="priceNow">--</span>
            <span class="price-change" id="priceChange">--</span>
        </div>
        <div style="font-size:var(--font-xs);color:var(--sub);width:100%" id="stockNameFull">输入代码查看实时行情</div>
        <div class="info-grid">
            <div>开盘<span id="infoOpen">--</span></div>
            <div>最高<span id="infoHigh">--</span></div>
            <div>最低<span id="infoLow">--</span></div>
            <div>昨收<span id="infoPre">--</span></div>
            <div>振幅<span id="infoAmp">--</span></div>
            <div>量比<span id="infoQrr">--</span></div>
            <div>换手<span id="infoTurn">--</span></div>
            <div>成交额<span id="infoAmt">--</span></div>
        </div>
    </div>

    <div class="chart-container" id="chartContainer">
        <span class="chart-label">📈 分时走势</span>
        <canvas id="chartCanvas"></canvas>
    </div>

    <div class="ai-panel">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="ai-badge">🤖 AI分析</span>
            <span style="font-size:var(--font-xs);color:var(--sub)" id="aiUpdateTime">--</span>
        </div>
        <div class="ai-signal wait" id="aiSignal">⏳ 等待数据...</div>
        <div class="ai-detail" id="aiDetail"></div>
        <div class="ai-prices">
            <div class="ai-price-item">
                <div class="label">🎯 高抛/止盈价</div>
                <div class="val sell-p" id="aiSellPrice">--</div>
            </div>
            <div class="ai-price-item">
                <div class="label">🎯 低吸/止损价</div>
                <div class="val buy-p" id="aiBuyPrice">--</div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--font-xs);color:var(--sub)">
            <span>综合评分</span>
            <div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%;background:#d2991d"></div></div>
            <span id="scoreText">0</span>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== 全局状态 ====================
        let currentCode = '';          // 纯数字代码
        let currentFullCode = '';      // sh/sz+代码
        let currentName = '';
        let priceData = { now:0, open:0, high:0, low:0, preClose:0, volume:0, amount:0, turnover:0, qrr:0 };
        let minuteData = [];
        let dailyKlines = [];

        // ==================== 工具函数 ====================
        function showToast(msg, type='') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.className = 'toast', 2000);
        }

        // 数字代码转标准代码
        function toFullCode(numCode) {
            numCode = String(numCode).trim();
            if (/^\d{6}$/.test(numCode)) {
                if (numCode.startsWith('6')) return 'sh' + numCode;
                return 'sz' + numCode;
            }
            return null;
        }

        // JSONP 请求
        function jsonp(url, timeoutMs=8000) {
            return new Promise((resolve, reject) => {
                const cb = '_jsonp_' + Date.now() + Math.random().toString(36).substr(2,5);
                const script = document.createElement('script');
                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error('请求超时'));
                }, timeoutMs);
                function cleanup() {
                    clearTimeout(timer);
                    delete window[cb];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }
                window[cb] = function(data) {
                    cleanup();
                    resolve(data);
                };
                script.onerror = () => { cleanup(); reject(new Error('请求失败')); };
                const sep = url.includes('?') ? '&' : '?';
                script.src = url + sep + 'callback=' + cb + '&_=' + Date.now();
                document.head.appendChild(script);
            });
        }

        // ==================== 数据接口 ====================
        async function fetchQuote(fullCode) {
            const url = `https://qt.gtimg.cn/q=${fullCode}`;
            const raw = await jsonp(url);
            const key = 'v_' + fullCode;
            let str = typeof raw === 'object' ? (raw[key] || '') : raw;
            if (!str) throw new Error('无数据');
            const parts = str.split('~');
            if (parts.length < 50) throw new Error('格式错误');
            return {
                name: parts[1] || '',
                now: parseFloat(parts[3]) || 0,
                preClose: parseFloat(parts[4]) || 0,
                open: parseFloat(parts[5]) || 0,
                volume: parseFloat(parts[6]) || 0,
                high: parseFloat(parts[33]) || 0,
                low: parseFloat(parts[34]) || 0,
                amount: parseFloat(parts[37]) || 0,
                turnover: parseFloat(parts[38]) || 0,
                qrr: parseFloat(parts[49]) || 0,
            };
        }

        async function fetchMinuteData(fullCode) {
            const url = `https://web.ifzq.gtimg.cn/appstock/app/minute/query?code=${fullCode}`;
            const data = await jsonp(url);
            if (data.code !== 0 || !data.data) return [];
            const key = Object.keys(data.data)[0];
            const mins = data.data[key]?.data?.data || [];
            return mins.map(m => ({
                time: m[0] || '',
                price: parseFloat(m[1]) || 0,
                volume: parseFloat(m[2]) || 0,
                avg: parseFloat(m[3]) || 0,
            })).filter(m => m.price > 0);
        }

        async function fetchKline(fullCode) {
            const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${fullCode},day,,,60`;
            const data = await jsonp(url);
            if (data.code !== 0 || !data.data) return [];
            const key = Object.keys(data.data)[0];
            const klines = data.data[key]?.day || data.data[key]?.qfqday || [];
            return klines.map(k => ({
                date: k[0], open: parseFloat(k[1]), close: parseFloat(k[2]),
                high: parseFloat(k[3]), low: parseFloat(k[4]), volume: parseFloat(k[5])
            })).filter(k => k.close > 0);
        }

        // ==================== 技术分析（与前版相同，已精简） ====================
        function calcEMA(data, period) {
            if (data.length < period) return Array(data.length).fill(null);
            const k = 2 / (period + 1);
            const result = [data[0]];
            for (let i = 1; i < data.length; i++) result.push(data[i] * k + result[i-1] * (1 - k));
            for (let i = 0; i < period-1; i++) result[i] = null;
            return result;
        }

        function calcMACD(closes) {
            const ema12 = calcEMA(closes, 12), ema26 = calcEMA(closes, 26);
            const dif = [], dea = [], macd = [];
            for (let i = 0; i < closes.length; i++) {
                if (ema12[i] !== null && ema26[i] !== null) dif.push(ema12[i] - ema26[i]);
                else dif.push(null);
            }
            const validDif = dif.filter(d => d !== null);
            const deaCalc = calcEMA(validDif, 9);
            let idx = 0;
            for (let i = 0; i < dif.length; i++) {
                if (dif[i] !== null && idx < deaCalc.length) dea.push(deaCalc[idx++]);
                else dea.push(null);
            }
            for (let i = 0; i < dif.length; i++) {
                if (dif[i] !== null && dea[i] !== null) macd.push((dif[i] - dea[i]) * 2);
                else macd.push(null);
            }
            return { dif, dea, macd };
        }

        function calcKDJ(highs, lows, closes, n=9) {
            const k=[],d=[],j=[];
            for (let i=0;i<closes.length;i++) {
                if (i<n-1) { k.push(null);d.push(null);j.push(null); continue; }
                const hh=Math.max(...highs.slice(i-n+1,i+1));
                const ll=Math.min(...lows.slice(i-n+1,i+1));
                const rsv = hh===ll ? 50 : ((closes[i]-ll)/(hh-ll))*100;
                const prevK=i>0&&k[i-1]!==null?k[i-1]:50, prevD=i>0&&d[i-1]!==null?d[i-1]:50;
                const kv=prevK*2/3+rsv/3, dv=prevD*2/3+kv/3, jv=3*kv-2*dv;
                k.push(kv); d.push(dv); j.push(jv);
            }
            return {k,d,j};
        }

        function calcRSI(closes, period=14) {
            const rsi=[];
            for (let i=0;i<closes.length;i++) {
                if (i<period) { rsi.push(null); continue; }
                let gain=0, loss=0;
                for (let t=i-period+1;t<=i;t++) {
                    const diff=closes[t]-closes[t-1];
                    if (diff>0) gain+=diff; else loss+=Math.abs(diff);
                }
                const ag=gain/period, al=loss/period;
                rsi.push(al===0?100:100-100/(1+ag/al));
            }
            return rsi;
        }

        function calcBOLL(closes, period=20, mult=2) {
            const ma=[], upper=[], lower=[];
            for (let i=0;i<closes.length;i++) {
                if (i<period-1) { ma.push(null);upper.push(null);lower.push(null); continue; }
                const slice=closes.slice(i-period+1,i+1);
                const mean=slice.reduce((a,b)=>a+b,0)/period;
                const variance=slice.reduce((sum,v)=>sum+Math.pow(v-mean,2),0)/period;
                const std=Math.sqrt(variance);
                ma.push(mean); upper.push(mean+mult*std); lower.push(mean-mult*std);
            }
            return {ma,upper,lower};
        }

        function findSupportResistance(klines) {
            if (klines.length<20) return {support:0,resistance:0};
            const highs=klines.map(k=>k.high), lows=klines.map(k=>k.low);
            const peaks=[], troughs=[];
            for (let i=5;i<highs.length-5;i++) {
                let isPeak=true;
                for (let j=i-3;j<=i+3;j++) if (j!==i && highs[j]>=highs[i]) { isPeak=false; break; }
                if (isPeak) peaks.push(highs[i]);
                let isTrough=true;
                for (let j=i-3;j<=i+3;j++) if (j!==i && lows[j]<=lows[i]) { isTrough=false; break; }
                if (isTrough) troughs.push(lows[i]);
            }
            const res = peaks.length>0 ? peaks.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,peaks.length) : Math.max(...highs.slice(-20));
            const sup = troughs.length>0 ? troughs.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,troughs.length) : Math.min(...lows.slice(-20));
            return {support:Math.round(sup*100)/100, resistance:Math.round(res*100)/100};
        }

        function aiAnalyze(priceData, minuteData, klines) {
            const now=priceData.now, preClose=priceData.preClose;
            const amp = (priceData.high>0 && priceData.low>0) ? ((priceData.high-priceData.low)/preClose*100) : 0;
            priceData.amp = amp;
            let scoreBuy=0, scoreSell=0;
            const reasons=[];

            if (minuteData.length>30 && now>0) {
                const avgs = minuteData.slice(-30).reduce((s,m)=>s+m.avg,0)/30;
                const dev = (now-avgs)/avgs*100;
                if (dev<-0.5) { scoreBuy+=12; reasons.push('价格低于均线'); }
                else if (dev>0.6) { scoreSell+=14; reasons.push('价格高于均线'); }
            }

            if (klines.length>=30) {
                const closes=klines.map(k=>k.close), highs=klines.map(k=>k.high), lows=klines.map(k=>k.low);
                const volumes=klines.map(k=>k.volume);
                const macdRes=calcMACD(closes);
                const lastMacd=macdRes.macd[macdRes.macd.length-1], prevMacd=macdRes.macd[macdRes.macd.length-2];
                const lastDif=macdRes.dif[macdRes.dif.length-1], lastDea=macdRes.dea[macdRes.dea.length-1];
                if (lastMacd!==null && prevMacd!==null) {
                    if (lastMacd>prevMacd && lastMacd<0) { scoreBuy+=10; reasons.push('MACD绿柱缩短'); }
                    if (lastMacd<prevMacd && lastMacd>0) { scoreSell+=10; reasons.push('MACD红柱缩短'); }
                }
                const kdj=calcKDJ(highs,lows,closes);
                const lastK=kdj.k[kdj.k.length-1], lastD=kdj.d[kdj.d.length-1];
                if (lastK!==null && lastD!==null) {
                    if (lastK<25 && lastD<25) { scoreBuy+=8; reasons.push('KDJ超卖'); }
                    if (lastK>75 && lastD>75) { scoreSell+=8; reasons.push('KDJ超买'); }
                }
                const rsi=calcRSI(closes);
                const lastRSI=rsi[rsi.length-1];
                if (lastRSI!==null) {
                    if (lastRSI<30) { scoreBuy+=8; reasons.push('RSI超卖'); }
                    if (lastRSI>70) { scoreSell+=8; reasons.push('RSI超买'); }
                }
                const boll=calcBOLL(closes);
                const lastUpper=boll.upper[boll.upper.length-1], lastLower=boll.lower[boll.lower.length-1];
                if (lastLower!==null) {
                    if (closes[closes.length-1] <= lastLower*1.01) { scoreBuy+=10; reasons.push('触及BOLL下轨'); }
                    if (closes[closes.length-1] >= lastUpper*0.99) { scoreSell+=10; reasons.push('触及BOLL上轨'); }
                }
                const sr=findSupportResistance(klines);
                if (sr.support>0) {
                    const dist = (now-sr.support)/sr.support*100;
                    if (dist<1.5) { scoreBuy+=12; reasons.push('接近支撑'); }
                }
                if (sr.resistance>0) {
                    const dist = (sr.resistance-now)/now*100;
                    if (dist<1.5) { scoreSell+=12; reasons.push('接近压力'); }
                }
            }

            let targetSpread=0.005;
            if (amp>4) targetSpread=0.015;
            else if (amp>2.5) targetSpread=0.01;
            else if (amp>1.5) targetSpread=0.007;

            if (scoreBuy>20 && scoreSell>20 && Math.abs(scoreBuy-scoreSell)<10) {
                scoreBuy=Math.floor(scoreBuy*0.6); scoreSell=Math.floor(scoreSell*0.6);
                reasons.push('信号矛盾');
            }

            let action='wait', actionLabel='⏸ 建议观望不动', actionClass='wait';
            let buyPrice=0, sellPrice=0;
            if (scoreBuy>45 && scoreBuy>scoreSell+15) {
                action='buy'; actionLabel='📈 适合做正T'; actionClass='buy';
                buyPrice = now*(1-targetSpread*0.4); sellPrice = now*(1+targetSpread);
            } else if (scoreSell>45 && scoreSell>scoreBuy+15) {
                action='sell'; actionLabel='📉 适合做反T'; actionClass='sell';
                sellPrice = now*(1+targetSpread*0.4); buyPrice = now*(1-targetSpread);
            } else if (scoreBuy>30) {
                action='lean_buy'; actionLabel='👀 偏多，可轻仓'; actionClass='buy';
                buyPrice=now*0.997; sellPrice=now*1.008;
            } else if (scoreSell>30) {
                action='lean_sell'; actionLabel='👀 偏空，可轻仓'; actionClass='sell';
                sellPrice=now*1.003; buyPrice=now*0.992;
            } else {
                buyPrice=now*0.995; sellPrice=now*1.005;
            }

            const showScore = Math.max(scoreBuy, scoreSell);
            return {
                action, actionLabel, actionClass,
                buyPrice: +buyPrice.toFixed(2), sellPrice: +sellPrice.toFixed(2),
                scorePercent: Math.min(100, Math.round(showScore/100*100)),
                detailText: reasons.slice(0,3).join('; ') || '指标正常'
            };
        }

        // ==================== UI更新 ====================
        function updatePriceUI() {
            const p = priceData;
            document.getElementById('priceNow').textContent = p.now>0 ? p.now.toFixed(2) : '--';
            const chg = document.getElementById('priceChange');
            if (p.now>0 && p.preClose>0) {
                const diff = p.now - p.preClose;
                const pct = diff / p.preClose * 100;
                const sign = diff>=0 ? '+' : '';
                chg.textContent = `${sign}${diff.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
                chg.className = 'price-change ' + (diff>0?'up':'down');
                document.getElementById('priceNow').style.color = diff>0 ? '#f85149' : '#3fb950';
            }
            document.getElementById('stockNameFull').textContent = `${currentName || '--'} | ${currentCode}`;
            document.getElementById('infoOpen').textContent = p.open>0?p.open.toFixed(2):'--';
            document.getElementById('infoHigh').textContent = p.high>0?p.high.toFixed(2):'--';
            document.getElementById('infoLow').textContent = p.low>0?p.low.toFixed(2):'--';
            document.getElementById('infoPre').textContent = p.preClose>0?p.preClose.toFixed(2):'--';
            const amp = p.amp || (p.high>0&&p.low>0?((p.high-p.low)/p.preClose*100):0);
            document.getElementById('infoAmp').textContent = amp>0?amp.toFixed(2)+'%':'--';
            document.getElementById('infoQrr').textContent = p.qrr>0?p.qrr.toFixed(2):'--';
            document.getElementById('infoTurn').textContent = p.turnover>0?p.turnover.toFixed(2)+'%':'--';
            document.getElementById('infoAmt').textContent = p.amount>0?(p.amount>=10000?(p.amount/10000).toFixed(2)+'亿':p.amount.toFixed(0)+'万'):'--';
        }

        function updateAI(analysis) {
            document.getElementById('aiSignal').textContent = analysis.actionLabel;
            document.getElementById('aiSignal').className = 'ai-signal ' + analysis.actionClass;
            document.getElementById('aiDetail').textContent = analysis.detailText;
            document.getElementById('aiSellPrice').textContent = analysis.sellPrice>0?analysis.sellPrice.toFixed(2):'--';
            document.getElementById('aiBuyPrice').textContent = analysis.buyPrice>0?analysis.buyPrice.toFixed(2):'--';
            document.getElementById('scoreFill').style.width = analysis.scorePercent+'%';
            const fill = document.getElementById('scoreFill');
            fill.style.background = analysis.actionClass==='buy'?'#f85149':analysis.actionClass==='sell'?'#3fb950':'#d2991d';
            document.getElementById('scoreText').textContent = analysis.scorePercent;
            document.getElementById('aiUpdateTime').textContent = new Date().toLocaleTimeString('zh-CN');
        }

        function drawChart() {
            const container = document.getElementById('chartContainer');
            const canvas = document.getElementById('chartCanvas');
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = rect.width - 8, h = rect.height - 8;
            canvas.width = w * dpr; canvas.height = h * dpr;
            canvas.style.width = w+'px'; canvas.style.height = h+'px';
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0,0,w,h);

            if (minuteData.length < 5) {
                ctx.fillStyle = '#8b949e'; ctx.font = '14px sans-serif';
                ctx.textAlign = 'center'; ctx.fillText('分时数据加载中...', w/2, h/2);
                return;
            }
            const prices = minuteData.map(m=>m.price);
            const avgs = minuteData.map(m=>m.avg).filter(a=>a>0);
            let minP = Math.min(...prices), maxP = Math.max(...prices);
            if (priceData.high>0) maxP = Math.max(maxP, priceData.high);
            if (priceData.low>0) minP = Math.min(minP, priceData.low);
            const range = maxP - minP || 1;
            const pad = range * 0.1;
            const yMin = minP - pad, yMax = maxP + pad;
            const margin = {top:20,right:15,bottom:25,left:55};
            const pw = w - margin.left - margin.right, ph = h - margin.top - margin.bottom;
            const xPos = i => margin.left + (i / Math.max(minuteData.length-1,1)) * pw;
            const yPos = p => margin.top + ph - ((p - yMin) / (yMax - yMin)) * ph;

            // 网格
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth=0.5;
            for (let i=0;i<=5;i++) {
                const y = margin.top + (ph/5)*i;
                ctx.beginPath(); ctx.moveTo(margin.left,y); ctx.lineTo(w-margin.right,y); ctx.stroke();
                ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif'; ctx.textAlign='right';
                ctx.fillText((yMax - (yMax-yMin)*(i/5)).toFixed(2), margin.left-4, y+3);
            }
            // 昨收线
            if (priceData.preClose>=yMin && priceData.preClose<=yMax) {
                const yp = yPos(priceData.preClose);
                ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,255,255,0.2)';
                ctx.beginPath(); ctx.moveTo(margin.left,yp); ctx.lineTo(w-margin.right,yp); ctx.stroke();
                ctx.setLineDash([]);
            }
            // 分时线
            ctx.strokeStyle='#58a6ff'; ctx.lineWidth=2; ctx.beginPath();
            minuteData.forEach((m,i) => {
                const x=xPos(i), y=yPos(m.price);
                i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
            });
            ctx.stroke();
            // 均线
            if (avgs.length>5) {
                ctx.strokeStyle='#d2991d'; ctx.lineWidth=1.3; ctx.setLineDash([4,3]); ctx.beginPath();
                let started=false;
                minuteData.forEach((m,i) => {
                    if (m.avg>0) {
                        const x=xPos(i), y=yPos(m.avg);
                        if (!started) { ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
                    }
                });
                ctx.stroke(); ctx.setLineDash([]);
            }
        }

        // ==================== 核心加载 ====================
        async function searchStock() {
            const input = document.getElementById('codeInput').value.trim();
            if (!input) return showToast('请输入股票代码', 'warn');
            const full = toFullCode(input);
            if (!full) return showToast('代码格式错误（6位数字）', 'warn');
            currentCode = input;
            currentFullCode = full;
            document.getElementById('aiSignal').textContent = '⏳ 加载中...';
            try {
                const [quote, mins, klines] = await Promise.all([
                    fetchQuote(full),
                    fetchMinuteData(full),
                    fetchKline(full)
                ]);
                if (!quote || quote.now <= 0) throw new Error('未获取到行情');
                currentName = quote.name || input;
                priceData = { ...quote, amp:0 };
                minuteData = mins;
                dailyKlines = klines;
                updatePriceUI();
                drawChart();
                if (dailyKlines.length >= 20) {
                    const analysis = aiAnalyze(priceData, minuteData, dailyKlines);
                    updateAI(analysis);
                } else {
                    document.getElementById('aiSignal').textContent = '数据不足';
                }
            } catch (e) {
                document.getElementById('aiSignal').textContent = '⚠ 获取失败';
                showToast('获取失败，请重试', 'warn');
                console.error(e);
            }
        }

        // 回车查询
        document.getElementById('codeInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchStock();
        });

        // 默认展示茅台（可选）
        window.addEventListener('load', () => {
            document.getElementById('codeInput').value = '600519';
            searchStock();
        });
    </script>
